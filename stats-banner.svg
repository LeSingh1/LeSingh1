<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Career stats banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#552583"/>
      <stop offset="100%" stop-color="#2d0f50"/>
    </linearGradient>
    <linearGradient id="goldStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#FDB927"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDB927" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FDB927" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FDB927" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .num { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; fill: #FDB927; letter-spacing: -0.02em; }
      .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; fill: #ffffff; letter-spacing: 0.18em; }
      .footer { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; fill: #FDB927; letter-spacing: 0.2em; }

      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.95; transform: scale(1.04); } }
      .n1 { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .n2 { animation: pulse 2.2s ease-in-out infinite 0.4s; transform-origin: center; transform-box: fill-box; }
      .n3 { animation: pulse 2.2s ease-in-out infinite 0.8s; transform-origin: center; transform-box: fill-box; }
      .n4 { animation: pulse 2.2s ease-in-out infinite 1.2s; transform-origin: center; transform-box: fill-box; }
      .n5 { animation: pulse 2.2s ease-in-out infinite 1.6s; transform-origin: center; transform-box: fill-box; }

      @keyframes shimmerSweep { 0% { transform: translateX(-400px); } 100% { transform: translateX(1100px); } }
      .shimmer-bar { animation: shimmerSweep 5s ease-in-out infinite; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" rx="10" fill="url(#bg)"/>

  <!-- Gold top/bottom stripes -->
  <rect width="900" height="4" fill="url(#goldStripe)"/>
  <rect y="156" width="900" height="4" fill="url(#goldStripe)"/>

  <!-- Stat 1: 23 PRs MERGED -->
  <g transform="translate(90 0)">
    <text class="num n1" x="0" y="80" font-size="46" text-anchor="middle">28</text>
    <text class="label" x="0" y="110" font-size="10" text-anchor="middle">PRs MERGED</text>
  </g>

  <line x1="180" y1="40" x2="180" y2="120" stroke="#FDB927" stroke-width="0.8" opacity="0.35"/>

  <!-- Stat 2: 10 ORGS REACHED -->
  <g transform="translate(270 0)">
    <text class="num n2" x="0" y="80" font-size="46" text-anchor="middle">11</text>
    <text class="label" x="0" y="110" font-size="10" text-anchor="middle">ORGS REACHED</text>
  </g>

  <line x1="360" y1="40" x2="360" y2="120" stroke="#FDB927" stroke-width="0.8" opacity="0.35"/>

  <!-- Stat 3: $500 HACKATHON WIN -->
  <g transform="translate(450 0)">
    <text class="num n3" x="0" y="80" font-size="38" text-anchor="middle">$1,100</text>
    <text class="label" x="0" y="110" font-size="10" text-anchor="middle">HACKATHON WINS</text>
  </g>

  <line x1="540" y1="40" x2="540" y2="120" stroke="#FDB927" stroke-width="0.8" opacity="0.35"/>

  <!-- Stat 4: $225K SAVED IN DEMO -->
  <g transform="translate(630 0)">
    <text class="num n4" x="0" y="80" font-size="44" text-anchor="middle">$225K</text>
    <text class="label" x="0" y="110" font-size="10" text-anchor="middle">SAVED IN DEMO</text>
  </g>

  <line x1="720" y1="40" x2="720" y2="120" stroke="#FDB927" stroke-width="0.8" opacity="0.35"/>

  <!-- Stat 5: 50+ PRs IN REVIEW -->
  <g transform="translate(810 0)">
    <text class="num n5" x="0" y="80" font-size="46" text-anchor="middle">50+</text>
    <text class="label" x="0" y="110" font-size="10" text-anchor="middle">IN REVIEW</text>
  </g>

  <!-- Footer text -->
  <text class="footer" x="450" y="145" font-size="8" text-anchor="middle">★ ROOKIE STATS · 2026 · 1ST EDITION HOLO ★</text>

  <!-- Animated shimmer sweep across the banner -->
  <rect class="shimmer-bar" x="-300" y="0" width="300" height="160" fill="url(#shimmer)" rx="10"/>
</svg>
