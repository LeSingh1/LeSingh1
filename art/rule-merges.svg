    <pattern id="htRmerges" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.7" fill="#002B5C" opacity="0.07"/>
    </pattern>
    <pattern id="htbRmerges" width="14" height="14" patternUnits="userSpaceOnUse">
