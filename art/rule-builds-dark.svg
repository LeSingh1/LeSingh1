<defs>
    <pattern id="htRbuilds" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.7" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
    <pattern id="htbRbuilds" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3.4" cy="3.4" r="3.0" fill="#FFFFFF" opacity="0.16"/>
    </pattern>
    <pattern id="hatchRbuilds" width="13" height="13" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-38)">
      <rect width="5" height="13" fill="#FFFFFF" opacity="0.22"/>
    </pattern>
    <filter id="grainRbuilds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <filter id="roughRbuilds" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="6"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="sheenRbuilds" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      @keyframes sweepRbuilds { 0% {transform:translateX(-300px)} 100% {transform:translateX(1450px)} }
      @keyframes growRbuilds { from {transform:scaleX(.82)} to {transform:scaleX(1)} }
      .swRbuilds { animation: sweepRbuilds 8s cubic-bezier(.5,0,.5,1) infinite }
      .gRbuilds { animation: growRbuilds 1.2s cubic-bezier(.16,1,.3,1) both; transform-origin: 0 0 }
    ]]></style>
  </defs>
