<svg width="1200" height="104" viewBox="0 0 1200 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 07: Game Log">
<title>Section 07: Game Log</title>
<defs>
    
    <filter id="roughRgamelog" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="raggedRgamelog" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="5" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sprayRgamelog" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="3" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grainRgamelog" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
    
    <pattern id="dotsRgamelog" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2.0" fill="#FFFFFF" opacity="0.13"/>
    </pattern>
    <pattern id="dotsLRgamelog" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.4" fill="#FFFFFF" opacity="0.13"/>
    </pattern>
    <pattern id="slashRgamelog" width="14" height="14" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-40)">
      <rect width="5.5" height="14" fill="#FFFFFF" opacity="0.28"/>
    </pattern>
    <linearGradient id="shRgamelog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      @keyframes swRgamelog { 0%{transform:translateX(-320px)} 100%{transform:translateX(1460px)} }
      @keyframes drRgamelog { 0%{transform:scaleY(.82)} 100%{transform:scaleY(1)} }
      .swRgamelog { animation: swRgamelog 7.5s cubic-bezier(.45,0,.55,1) infinite }
      .drRgamelog { animation: drRgamelog 3.2s ease-in-out infinite alternate;
                  transform-box: fill-box; transform-origin: top center }
      
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important }
      }
    ]]></style>
  </defs>
