<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shaurya Singh scoreboard">
  <defs>
    <style><![CDATA[
      .bg { fill: #08090c; }
      .panel { fill: #11141b; stroke: #1f2530; stroke-width: 1; }
      .grid { stroke: #1a1f29; stroke-width: 1; }
      .led-amber { font-family: 'Courier New', ui-monospace, monospace; font-weight: 900; fill: #f59e0b; }
      .led-cyan { font-family: 'Courier New', ui-monospace, monospace; font-weight: 900; fill: #38bdf8; }
      .label { font-family: 'Courier New', ui-monospace, monospace; fill: #64748b; font-size: 11px; letter-spacing: 0.22em; }
      .label-bright { font-family: 'Courier New', ui-monospace, monospace; fill: #94a3b8; font-size: 12px; letter-spacing: 0.22em; }
      .name { font-family: 'Courier New', ui-monospace, monospace; fill: #e2e8f0; font-size: 22px; font-weight: 700; letter-spacing: 0.18em; }
      .vs { font-family: 'Georgia', serif; fill: #475569; font-size: 28px; font-style: italic; }
      .row-key { font-family: 'Courier New', ui-monospace, monospace; fill: #64748b; font-size: 13px; letter-spacing: 0.1em; }
      .row-repo { font-family: 'Courier New', ui-monospace, monospace; fill: #e2e8f0; font-size: 13px; }
      .row-desc { font-family: 'Courier New', ui-monospace, monospace; fill: #94a3b8; font-size: 12px; }
      .check { fill: #22c55e; font-family: 'Courier New', monospace; font-size: 14px; font-weight: 700; }
      .live-dot { fill: #ef4444; }
      .ticker-text { font-family: 'Courier New', ui-monospace, monospace; fill: #64748b; font-size: 12px; letter-spacing: 0.15em; }

      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .pulse { animation: pulse 1.4s ease-in-out infinite; }

      @keyframes flicker {
        0%, 100% { opacity: 1; }
        7% { opacity: 0.7; }
        8% { opacity: 1; }
        90% { opacity: 1; }
        91% { opacity: 0.5; }
        92% { opacity: 1; }
      }
      .flicker-a { animation: flicker 6s ease-in-out infinite; }
      .flicker-b { animation: flicker 7.3s ease-in-out infinite 0.4s; }

      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .ticker { animation: scroll 38s linear infinite; }

      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .blink { animation: blink 1s steps(1) infinite; }
    ]]></style>
  </defs>

  <rect class="bg" width="900" height="500"/>

  <!-- subtle grid -->
  <g opacity="0.35">
    <line class="grid" x1="0" y1="56" x2="900" y2="56"/>
    <line class="grid" x1="0" y1="260" x2="900" y2="260"/>
    <line class="grid" x1="0" y1="448" x2="900" y2="448"/>
  </g>

  <!-- TOP BAR -->
  <g>
    <circle class="live-dot pulse" cx="22" cy="32" r="5"/>
    <text x="34" y="36" class="label-bright">LIVE</text>
    <text x="88" y="36" class="label">FREMONT MEMORIAL · OPEN SOURCE LEAGUE</text>
    <text x="760" y="36" class="label">Q<tspan class="led-amber">5</tspan> · <tspan>14:0<tspan class="blink">2</tspan></tspan></text>
  </g>

  <!-- HOME (Shaurya) -->
  <rect class="panel" x="32" y="76" width="380" height="172" rx="8"/>
  <text x="222" y="106" class="label" text-anchor="middle">HOME</text>
  <text x="222" y="138" class="name" text-anchor="middle">SHAURYA</text>
  <text x="222" y="216" class="led-amber flicker-a" text-anchor="middle" font-size="96">23</text>
  <text x="222" y="236" class="label" text-anchor="middle">PRs MERGED</text>

  <!-- VS -->
  <text x="450" y="170" class="vs" text-anchor="middle">vs</text>

  <!-- AWAY (Big Tech) -->
  <rect class="panel" x="488" y="76" width="380" height="172" rx="8"/>
  <text x="678" y="106" class="label" text-anchor="middle">AWAY</text>
  <text x="678" y="138" class="name" text-anchor="middle">BIG TECH</text>
  <text x="678" y="216" class="led-cyan flicker-b" text-anchor="middle" font-size="96">50+</text>
  <text x="678" y="236" class="label" text-anchor="middle">IN REVIEW</text>

  <!-- HIGHLIGHTS -->
  <rect class="panel" x="32" y="278" width="836" height="160" rx="8"/>
  <text x="52" y="304" class="label">TONIGHT'S HIGHLIGHTS</text>
  <text x="848" y="304" class="label" text-anchor="end">FY 2026 · MAY</text>

  <g transform="translate(52, 332)">
    <text class="row-key">Q1</text>
    <text x="42" class="row-repo">meta/pyrefly#3415</text>
    <text x="290" class="check">+1</text>
    <text x="320" class="row-desc">flagship landing · Phabricator commit 92413ec</text>
  </g>
  <g transform="translate(52, 357)">
    <text class="row-key">Q2</text>
    <text x="42" class="row-repo">apple/container</text>
    <text x="290" class="check">+1</text>
    <text x="320" class="row-desc">build-time message correction</text>
  </g>
  <g transform="translate(52, 382)">
    <text class="row-key">Q3</text>
    <text x="42" class="row-repo">microsoft/rushstack-websites</text>
    <text x="290" class="check">+1</text>
    <text x="320" class="row-desc">install-run lockfile env-var docs · closed #5359</text>
  </g>
  <g transform="translate(52, 407)">
    <text class="row-key">Q4</text>
    <text x="42" class="row-repo">nvidia/cccl + cloudflare/wrangler</text>
    <text x="290" class="check">+2</text>
    <text x="320" class="row-desc">CMake config · CLI docs</text>
  </g>

  <!-- TICKER -->
  <rect class="panel" x="0" y="460" width="900" height="40" rx="0"/>
  <clipPath id="ticker-clip"><rect x="0" y="460" width="900" height="40"/></clipPath>
  <g clip-path="url(#ticker-clip)">
    <g class="ticker">
      <text x="20" y="485" class="ticker-text">▸ ON DECK ─ openai · cloudflare · google · astral-sh · vercel · prettier · esbuild · deno-land · swiftlang · pytorch · sqlalchemy · denoland · playwright · dspy · pallets · &nbsp;&nbsp;&nbsp;</text>
      <text x="1180" y="485" class="ticker-text">▸ ON DECK ─ openai · cloudflare · google · astral-sh · vercel · prettier · esbuild · deno-land · swiftlang · pytorch · sqlalchemy · denoland · playwright · dspy · pallets · &nbsp;&nbsp;&nbsp;</text>
    </g>
  </g>
</svg>
