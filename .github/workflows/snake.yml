name: Contribution snake

# Redraws the contribution snake in Philadelphia blue and red once a day and
# publishes it to the `output` branch, which the README embeds.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake (light and dark)
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#c8102e&color_dots=#e6ebf3,#b4c7e6,#7a9fd8,#3d6cc0,#1d428a
            dist/snake-dark.svg?color_snake=#ed174c&color_dots=#161f33,#1a3566,#1d428a,#3d6cc0,#8fb6ec

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Redraw the contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
